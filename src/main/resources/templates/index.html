
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vendas</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <aside class="menu">
        <h2>Sistema de Vendas</h2>
        <nav>
            <a th:href="@{/}">Painel inicial</a>
            <a th:href="@{/produtos}">Produtos</a>
            <a th:href="@{/venda}">Nova venda</a>
            <a th:href="@{/historico}">Histórico</a>
        </nav>
    </aside>

    <main class="conteudo">
        <h1>Painel inicial</h1>
        <p>Resumo do sistema de vendas.</p>

        <section class="cartoes">
            <article class="cartao">
                <h2>Total de vendas</h2>
                <p th:text="${'R$ ' + #numbers.formatDecimal(totalVendas, 1, 2)}">R$ 0,00</p>
            </article>

            <article class="cartao">
                <h2>Produtos cadastrados</h2>
                <p th:text="${quantidadeProdutos}">0</p>
            </article>

            <article class="cartao">
                <h2>Vendas realizadas</h2>
                <p th:text="${quantidadeVendas}">0</p>
            </article>
        </section>

        <section class="painel">
            <h2>Últimas vendas</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Data e hora</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="venda : ${ultimasVendas}">
                        <td th:text="${venda.codigo}"></td>
                        <td th:text="${#temporals.format(venda.data, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(venda.total, 1, 2)}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(ultimasVendas)}">
                        <td colspan="3">Nenhuma venda cadastrada.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
