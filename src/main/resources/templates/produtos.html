
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Sistema de Vendas</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

    <aside class="menu">
        <h2>Sistema de Vendas</h2>

        <nav>
            <a th:href="@{/}">Painel inicial</a>
            <a th:href="@{/produtos}">Produtos</a>
            <a th:href="@{/venda}">Nova venda</a>
            <a th:href="@{/historico}">Histórico</a>
        </nav>
    </aside>

    <main class="conteudo">
        <h1>Produtos</h1>
        <p>Cadastre e consulte os produtos disponíveis para venda.</p>

        <p th:if="${sucesso}" th:text="${sucesso}"></p>

        <section class="painel">
            <h2>Cadastrar produto</h2>

            <form th:action="@{/produtos}" th:object="${produto}" method="post">
                <label for="nomeProduto">Nome do produto:</label>
                <input type="text" id="nomeProduto" th:field="*{nome}"
                       placeholder="Ex.: Teclado" required>

                <label for="precoProduto">Preço (R$):</label>
                <input type="number" id="precoProduto" th:field="*{preco}"
                       min="0.01" step="0.01"
                       placeholder="Ex.: 150.00" required>

                <label for="estoqueProduto">Quantidade em estoque:</label>
                <input type="number" id="estoqueProduto" th:field="*{estoque}"
                       min="0" step="1"
                       placeholder="Ex.: 10" required>

                <button type="submit">Cadastrar produto</button>
            </form>

            <p th:if="${#fields.hasErrors('produto')}" th:text="'Verifique os dados informados.'"></p>
        </section>

        <section class="painel">
            <h2>Produtos cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nome do produto</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="item : ${produtos}">
                        <td th:text="${item.codigo}"></td>
                        <td th:text="${item.nome}"></td>
                        <td th:text="${#numbers.formatDecimal(item.preco, 1, 2)}"></td>
                        <td th:text="${item.estoque}"></td>
                        <td>
                            <form th:action="@{/produtos/excluir/{codigo}(codigo=${item.codigo})}"
                                  method="post">
                                <button type="submit">Excluir</button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5">Nenhum produto cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

</body>
</html>
